name: Diabetes App CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:

  # ---------------------------------------------------------
  # CI: Test the application
  # ---------------------------------------------------------
  test:
    name: Test Application
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Test model loading
        run: |
          python -c "import joblib; model=joblib.load('model.pkl'); print(type(model))"


  # ---------------------------------------------------------
  # CI: Build Docker image
  # ---------------------------------------------------------
  docker:
    name: Build Docker Image
    needs: test
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build -t faaizantarkan/diabetes-app:latest .


  # ---------------------------------------------------------
  # CD: Push Docker image to Docker Hub
  # ---------------------------------------------------------
  push:
    name: Push Image to Docker Hub
    needs: docker
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker image
        run: |
          docker build -t faaizantarkan/diabetes-app:latest .

      - name: Push Docker image
        run: |
          docker push faaizantarkan/diabetes-app:latest